basePath: /api/v1
definitions:
  models.CreateTodoRequest:
    properties:
      description:
        description: Подробное описание задачи
        maxLength: 1000
        type: string
      done:
        description: По умолчанию false (задача не выполнена)
        type: boolean
      title:
        description: Краткое название задачи
        maxLength: 200
        type: string
      user_id:
        description: Владелец задачи
        type: integer
    required:
    - title
    - user_id
    type: object
  models.CreateUserRequest:
    properties:
      email:
        description: Email пользователя
        type: string
      name:
        description: Отображаемое имя пользователя
        maxLength: 100
        type: string
    required:
    - email
    - name
    type: object
  models.SuccessResponse:
    properties:
      data:
        description: Полезная нагрузка; может отсутствовать
      success:
        description: Всегда true в этом формате ответа
        type: boolean
    type: object
  models.Todo:
    properties:
      created_at:
        description: Дата и время создания (RFC 3339)
        type: string
      description:
        description: Подробное описание задачи
        type: string
      done:
        description: Признак выполнения задачи
        type: boolean
      id:
        description: Уникальный идентификатор задачи
        type: integer
      title:
        description: Краткое название задачи
        type: string
      updated_at:
        description: Дата и время последнего обновления (RFC 3339)
        type: string
      user_id:
        description: Идентификатор владельца задачи
        type: integer
    type: object
  models.UpdateTodoRequest:
    properties:
      description:
        description: Новое описание; nil — не менять
        maxLength: 1000
        type: string
      done:
        description: Новый статус; nil — не менять
        type: boolean
      title:
        description: Новое название; nil — не менять
        maxLength: 200
        type: string
    type: object
  models.UpdateUserRequest:
    properties:
      email:
        description: Новый email; nil — не менять
        type: string
      name:
        description: Новое имя; nil — не менять
        maxLength: 100
        type: string
    type: object
  models.User:
    properties:
      created_at:
        description: Дата и время регистрации (RFC 3339)
        type: string
      email:
        description: Email пользователя
        type: string
      id:
        description: Уникальный идентификатор пользователя
        type: integer
      name:
        description: Отображаемое имя пользователя
        type: string
    type: object
info:
  contact: {}
  description: Учебный REST API-сервис для управления задачами (todo) и пользователями.
  title: Todo API Service
  version: "1.0"
paths:
  /todos:
    get:
      description: Возвращает все задачи, существующие в системе.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Todo'
                  type: array
              type: object
      summary: Получить список всех задач
      tags:
      - todos
    post:
      consumes:
      - application/json
      description: Создаёт новую задачу для указанного пользователя и возвращает её.
      parameters:
      - description: Данные новой задачи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateTodoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Todo'
              type: object
        "400":
          description: Невалидный запрос
          schema:
            type: string
      summary: Создать новую задачу
      tags:
      - todos
  /todos/{id}:
    delete:
      description: Удаляет задачу с указанным идентификатором.
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Задача успешно удалена
        "400":
          description: Неверный ID
          schema:
            type: string
        "404":
          description: Задача не найдена
          schema:
            type: string
      summary: Удалить задачу
      tags:
      - todos
    get:
      description: Возвращает задачу с указанным идентификатором.
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Todo'
              type: object
        "400":
          description: Неверный ID
          schema:
            type: string
        "404":
          description: Задача не найдена
          schema:
            type: string
      summary: Получить задачу по ID
      tags:
      - todos
    put:
      consumes:
      - application/json
      description: Обновляет только те поля задачи, которые переданы в теле запроса.
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      - description: Поля для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateTodoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Todo'
              type: object
        "400":
          description: Неверный ID или невалидный запрос
          schema:
            type: string
        "404":
          description: Задача не найдена
          schema:
            type: string
      summary: Частично обновить задачу
      tags:
      - todos
  /users:
    get:
      description: Возвращает всех пользователей, зарегистрированных в системе.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.User'
                  type: array
              type: object
      summary: Получить список всех пользователей
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя с указанными email и именем.
      parameters:
      - description: Данные нового пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Невалидный запрос
          schema:
            type: string
      summary: Зарегистрировать нового пользователя
      tags:
      - users
  /users/{id}:
    delete:
      description: Удаляет пользователя с указанным идентификатором.
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Пользователь успешно удалён
        "400":
          description: Неверный ID
          schema:
            type: string
        "404":
          description: Пользователь не найден
          schema:
            type: string
      summary: Удалить пользователя
      tags:
      - users
    get:
      description: Возвращает пользователя с указанным идентификатором.
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Неверный ID
          schema:
            type: string
        "404":
          description: Пользователь не найден
          schema:
            type: string
      summary: Получить пользователя по ID
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Обновляет только те поля профиля, которые переданы в теле запроса.
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      - description: Поля для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Неверный ID или невалидный запрос
          schema:
            type: string
        "404":
          description: Пользователь не найден
          schema:
            type: string
      summary: Частично обновить пользователя
      tags:
      - users
swagger: "2.0"
